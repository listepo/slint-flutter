name: todo
description: The Slint todo example, as a Flutter application written in Dart.
version: 1.18.0
publish_to: none

environment:
  sdk: ^3.3.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  slint:
    path: ../../../slint
  slint_flutter:
    path: ../../../slint_flutter

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  slint_generator:
    path: ../../../slint_generator
