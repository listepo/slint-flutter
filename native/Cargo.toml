[package]
name = "slint-dart"
version = "1.18.0"
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
license = "MIT"
description = "Slint Dart and Flutter integration"
repository = "https://github.com/listepo/slint-flutter"
publish = false
rust-version = "1.92"

[lib]
path = "rust/lib.rs"
name = "slint_dart"
# `cdylib` is what applications load. `staticlib` is required by
# `native_toolchain_rust`, which the Dart build hook drives. `rlib` is what lets
# `cargo test` link the unit tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Keep in sync with the defaults of api/python/slint.
default = ["backend-linuxkms-noseat", "backend-winit", "renderer-femtovg", "renderer-skia", "accessibility"]

backend-qt = ["slint-interpreter/backend-qt"]
backend-winit = ["slint-interpreter/backend-winit"]
backend-winit-x11 = ["slint-interpreter/backend-winit-x11"]
backend-winit-wayland = ["slint-interpreter/backend-winit-wayland"]
backend-linuxkms = ["slint-interpreter/backend-linuxkms"]
backend-linuxkms-noseat = ["slint-interpreter/backend-linuxkms-noseat"]
# There is deliberately no `backend-testing` feature. It would have to enable
# `i-slint-backend-selector/backend-testing`, which turns on
# `i-slint-backend-testing/internal`, and the published crate cannot build that
# feature: it embeds a font directory that only exists inside the Slint
# repository. The Dart test suites install the software renderer through
# `SlintSurface` instead, which needs no window either.

renderer-femtovg = ["slint-interpreter/renderer-femtovg"]
renderer-skia = ["slint-interpreter/renderer-skia"]
renderer-skia-opengl = ["slint-interpreter/renderer-skia-opengl"]
renderer-skia-vulkan = ["slint-interpreter/renderer-skia-vulkan"]
renderer-software = ["slint-interpreter/renderer-software"]

accessibility = ["slint-interpreter/accessibility"]

[dependencies]
# For decoding the compiled module a generated wrapper carries. The encoder is
# in `codegen`, which nothing here depends on.
base64 = "0.22"
flate2 = "1"
# The interpreter's public API reports property and callback types with these.
i-slint-compiler = "1.17.1"
i-slint-core = { version = "1.17.1", features = ["tr"] }
i-slint-renderer-software = { version = "1.17.1", features = ["std"] }
slint-interpreter = { version = "1.17.1", features = ["compat-1-2", "display-diagnostics", "image-default-formats", "internal", "internal-json"] }
serde_json = "1.0.151"
spin_on = "0.1.1"
pathdiff = "0.2.1"

# On wasm `slint-interpreter` depends on the winit backend unconditionally, and
# that crate does not compile without a renderer. We never use it — the web
# build renders through `embedded.rs` — but it has to build, so pick the
# renderer that costs the least.
[target.'cfg(target_arch = "wasm32")'.dependencies]
i-slint-backend-winit = { version = "1.17.1", features = ["renderer-software"] }
# `slint-interpreter` leaves image and SVG decoding to the browser on wasm,
# which is right for a canvas renderer but not for this one: the software
# renderer rasterizes every pixel itself, and without these the widget icons
# in `std-widgets` panic with "The image cannot be rendered".
i-slint-core = { version = "1.17.1", features = ["image-decoders", "svg", "tr"] }
# `std::time::Instant` panics on wasm; this is the shim `i-slint-core` uses.
web-time = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Without this a Rust panic reaches the browser as a bare "unreachable" trap.
console_error_panic_hook = "0.1"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
# Tests only: one test generates a wrapper and instantiates it here, which is
# the contract between the two crates. The shipped library links neither the
# generator nor the compiler it uses.
slint-dart-codegen = { path = "codegen" }

# `codegen` is a generate-time tool, never a dependency of the runtime: an
# application links this crate and gets no compiler with it.
[workspace]
members = [".", "codegen"]
