name: slint_generator
resolution: workspace
description: The build_runner builder that generates a typed Dart API for each .slint file.
version: 1.18.0
homepage: https://github.com/listepo/slint-flutter
repository: https://github.com/listepo/slint-flutter
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bazel_worker: ^1.1.5
  build: '>=2.4.1 <5.0.0'
  path: ^1.8.0
  slint:
    path: ../slint

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
