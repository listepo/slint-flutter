name: sonarcloud

# SonarCloud OSS analysis: pull requests to main (drafts skipped), pushes to main, and manual
# runs. Soft-fail for now: the coverage and scan steps use continue-on-error, and every step
# soft-skips when the SONAR_TOKEN secret is empty (fork pull requests, or before the secret is
# added). Setup and how to make it blocking: docs/sonarcloud-setup.md
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Empty on fork pull requests and until the repository secret is added.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonarcloud:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud analysis."
          echo "Expected for fork pull requests and before the secret is added."
          echo "See docs/sonarcloud-setup.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: Sonar uses blame data for new-code detection.
          fetch-depth: 0

      # Flutter pin from .mise.toml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.SONAR_TOKEN != ''
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # Resolved packages let the Dart analyzer inside the scanner see the dependencies.
      - name: Resolve workspace
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: flutter pub get

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
